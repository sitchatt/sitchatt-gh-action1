name: deployment-practice-1
on: push
jobs:
  checkout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Checkout Check
        run: echo "Checked out the repository successfully!"
  lint:
      runs-on: ubuntu-latest
      needs: checkout
      steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Install Dependencies
        run: npm ci
      - name: Run Lint
        run: npm run lint

  test:
      runs-on: ubuntu-latest
      needs: checkout
      steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Install Dependencies
        run: npm ci
      - name: Run Tests
        run: npm test

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Install Dependencies
        run: npm ci
      - name: Build Project
        run: |
          npm run build
          echo "Build completed successfully!"
  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Install Dependencies
        run: npm ci
      - name: Deploy Application
        run: echo "Deploying the application..."
