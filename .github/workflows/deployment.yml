name: deployment-practice-1
on: push
jobs:
  checkout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Checkout Check
        run: echo "Checked out the repository successfully!"
  lint_test_build:
    runs-on: ubuntu-latest
    needs: checkout
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Install Dependencies
        run: npm ci
      - name: Run Lint
        run: npm run lint
      - name: Run Tests
        run: npm test
      - name: Build Project
        run: |
          npm run build
          echo "Build completed successfully!"
  deploy:
    runs-on: ubuntu-latest
    needs: lint_test_build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Deploy Application
        run: echo "Deploying the application..."
      
